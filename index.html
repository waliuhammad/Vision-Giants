<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e2142" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Enables scroll-reveal styles only when JS runs; falls back to fully visible content if the app fails to load.
      document.documentElement.classList.add('js');
      setTimeout(function () {
        if (!window.__hydrated) document.documentElement.classList.remove('js');
      }, 5000);
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
